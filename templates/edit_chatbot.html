<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Chatbot - College Enquiry</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f1f5fc;
            min-height: 100vh;
        }


        /* NAVBAR */

        .navbar {
            height: 75px;

            background: #1d477d;

            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 7%;
        }


        .logo {
            font-size: 25px;

            font-weight: bold;
        }


        .nav-right {
            display: flex;

            align-items: center;

            gap: 20px;
        }


        .dashboard-btn {
            color: white;

            text-decoration: none;

            font-weight: bold;
        }


        .logout-btn {
            background: #ffd35c;

            color: #173f73;

            padding: 10px 20px;

            border-radius: 7px;

            text-decoration: none;

            font-weight: bold;
        }


        /* MAIN */

        .container {
            width: 90%;

            max-width: 800px;

            margin: 50px auto;
        }


        .card {
            background: white;

            padding: 35px;

            border-radius: 16px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.08);
        }


        .heading {
            margin-bottom: 30px;
        }


        .heading h1 {
            color: #1d477d;

            font-size: 32px;

            margin-bottom: 8px;
        }


        .heading p {
            color: #666;

            font-size: 16px;
        }


        /* FORM */

        .form-group {
            margin-bottom: 22px;
        }


        .form-group label {
            display: block;

            color: #1d477d;

            font-weight: bold;

            margin-bottom: 9px;
        }


        .form-group input,
        .form-group textarea {
            width: 100%;

            padding: 14px;

            border: 1px solid #d0d7e5;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }


        .form-group textarea {
            min-height: 180px;

            resize: vertical;
        }


        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #2864e8;
        }


        /* BUTTONS */

        .buttons {
            display: flex;

            gap: 12px;

            margin-top: 25px;
        }


        .update-btn {
            background: #2864e8;

            color: white;

            border: none;

            padding: 13px 25px;

            border-radius: 7px;

            font-weight: bold;

            font-size: 16px;

            cursor: pointer;
        }


        .update-btn:hover {
            background: #1d55d0;
        }


        .cancel-btn {
            background: #e5e7eb;

            color: #333;

            padding: 13px 25px;

            border-radius: 7px;

            text-decoration: none;

            font-weight: bold;

            font-size: 16px;
        }


        .cancel-btn:hover {
            background: #d1d5db;
        }


        /* RESPONSIVE */

        @media(max-width: 600px) {

            .navbar {
                padding: 0 20px;
            }


            .logo {
                font-size: 19px;
            }


            .container {
                width: 94%;
            }


            .card {
                padding: 25px;
            }


            .buttons {
                flex-direction: column;
            }


            .update-btn,
            .cancel-btn {
                width: 100%;

                text-align: center;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <div class="navbar">


        <div class="logo">

            🎓 College Enquiry Admin

        </div>


        <div class="nav-right">


            <a
                href="/admin/dashboard"
                class="dashboard-btn">

                Dashboard

            </a>


            <a
                href="/admin/logout"
                class="logout-btn">

                Logout

            </a>


        </div>


    </div>



    <!-- =========================
         MAIN
    ========================= -->

    <div class="container">


        <div class="card">


            <!-- HEADING -->

            <div class="heading">

                <h1>

                    ✏️ Edit Chatbot Question

                </h1>


                <p>

                    Update the question and answer below.

                </p>

            </div>



            <!-- EDIT FORM -->

            <form
                action="/admin/chatbot/edit/{{ chatbot['id'] }}"
                method="POST">


                <!-- QUESTION -->

                <div class="form-group">

                    <label>

                        Question

                    </label>


                    <input
                        type="text"
                        name="question"
                        value="{{ chatbot['question'] }}"
                        placeholder="Enter question"
                        required>

                </div>



                <!-- ANSWER -->

                <div class="form-group">

                    <label>

                        Answer

                    </label>


                    <textarea
                        name="answer"
                        placeholder="Enter answer"
                        required>{{ chatbot['answer'] }}</textarea>

                </div>



                <!-- BUTTONS -->

                <div class="buttons">


                    <button
                        type="submit"
                        class="update-btn">

                        💾 Update Question

                    </button>


                    <a
                        href="/admin/chatbot"
                        class="cancel-btn">

                        Cancel

                    </a>


                </div>


            </form>


        </div>


    </div>


</body>

</html>
