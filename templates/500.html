<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>500 - Server Error</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background: #f4f7ff;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            color: #183b70;
        }

        .error-card {
            width: 90%;
            max-width: 600px;

            background: white;

            padding: 55px 35px;

            border-radius: 22px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.10);
        }

        .icon {
            font-size: 80px;

            margin-bottom: 15px;
        }

        h1 {
            font-size: 80px;

            color: #dc3545;

            margin-bottom: 10px;
        }

        h2 {
            color: #183b70;

            font-size: 28px;

            margin-bottom: 15px;
        }

        p {
            color: #66758b;

            font-size: 17px;

            line-height: 1.6;

            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;

            background: #2867e8;

            color: white;

            text-decoration: none;

            padding: 14px 25px;

            border-radius: 8px;

            font-weight: bold;
        }

        .btn:hover {
            background: #1d55d0;
        }

    </style>

</head>


<body>


    <div class="error-card">


        <div class="icon">
            ⚠️
        </div>


        <h1>
            500
        </h1>


        <h2>
            Server Error
        </h2>


        <p>
            Something went wrong on our server.
            Please try again after some time.
        </p>


        <a
            href="/"
            class="btn">

            🏠 Back to Home

        </a>


    </div>


</body>

</html>
